name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # `verify` 现在包含 Testcontainers 集成测试，会拉起一个真实的
      # postgres:16-alpine 容器。ubuntu-latest 自带 Docker daemon，无需额外配置。
      # 换用不提供 Docker 的 runner 时这一步会失败 —— 那不是配置问题：
      # 迁移重放和 ddl-auto: validate 的契约只有对真实 PostgreSQL 才有意义，
      # 不要为了让它跑起来换成内存库。
      - name: Build & Test
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # 阻塞项。2026-08-12 起 ESLint 是 0 错误，所以去掉了此前的 continue-on-error。
      #
      # 那 5 个遗留错误是这样清掉的（全部改源码，**没有**放宽 eslint.config.js）：
      #   - react-hooks/set-state-in-effect ×4 —— 取数改成在 effect 里直接写
      #     .then/.catch，setState 放进 promise 回调；需要手动刷新的地方
      #     （Tasks）用一个 reloadCount 计数器触发 effect，而不是再调一次取数函数。
      #   - react-refresh/only-export-components ×1 —— hooks/useAuth.jsx 拆成
      #     useAuth.js（context + hook）和 AuthProvider.jsx（组件）。
      #
      # 如果这一步开始失败：修源码，不要加 continue-on-error 或改规则。
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

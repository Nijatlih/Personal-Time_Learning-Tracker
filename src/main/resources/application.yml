spring:
  application:
    name: ptlt
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ptlt
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production-minimum-32-characters}
  access-token-validity: 900000  # 15 minutes in milliseconds
  refresh-token-validity: 604800000  # 7 days in milliseconds

server:
  port: 8080

logging:
  level:
    com.nijat.ptlt: DEBUG
    org.springframework.security: DEBUG

spring:
  application:
    name: ptlt
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ptlt}
    # 无默认值。此前默认成 postgres/postgres：凭据缺失时不会报错，而是拿一对
    # 众所周知的默认口令去连库 —— 连上了是安全问题，连不上则报成含糊的连接错误。
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # 不显式指定 dialect：Hibernate 6 会从 JDBC 元数据自己选，写死反而会触发
    # HHH90000025 弃用告警。
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 关闭。开着的话，目标库非空但没有 flyway_schema_history 时（从不含该表的
    # pg_dump 恢复、或上次部署留下的残表），Flyway 会静默 baseline 到 V1 并跳过它，
    # 然后 V2 因为 workspaces 不存在而炸。宁可一开始就明确失败。
    baseline-on-migrate: false

jwt:
  # No default. JwtUtil rejects a blank, too-short, or known-placeholder value at
  # startup, so a missing secret is a loud failure rather than a silent fallback to
  # a key that is readable in version control.
  secret: ${JWT_SECRET:}
  access-token-validity: 900000  # 15 minutes in milliseconds
  refresh-token-validity: 604800000  # 7 days in milliseconds

app:
  cors:
    # 显式来源列表。此前是通配符 "*" + allowCredentials，等于关闭同源隔离。
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}

server:
  port: 8080

logging:
  level:
    # INFO 而不是 DEBUG。security 的 DEBUG 会把每个请求的完整 filter 链和认证细节
    # 打进日志，本项目的应用日志同样如此 —— 噪音之外也更容易把敏感信息带出来。
    com.nijat.ptlt: INFO
    org.springframework.security: INFO

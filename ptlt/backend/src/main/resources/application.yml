spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ptlt}
    username: ${DB_USER:ptlt}
    password: ${DB_PASSWORD:ptlt}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    issuer: ptlt
    secret: ${JWT_SECRET:change-me-in-prod-change-me-in-prod-change-me-in-prod}
    accessTokenTtlSeconds: 3600
    refreshTokenTtlSeconds: 1209600
